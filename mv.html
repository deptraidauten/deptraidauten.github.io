<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0612">
<meta property="og:title" content="Chờ chút">
<meta property="og:description" content="Một MV nhỏ: phố cũ Hà Nội, một mái hiên, và một năm ở Nhật.">
<title>Chờ Chút MV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Dancing+Script:wght@700&family=Lora:ital,wght@1,500&display=swap">
<style>
  :root {
    --bg: #0B0612;
    --ink: #FFF4F8;
    --rose: #B8325A;
    --gold: #F2B84B;
    --glass: rgba(20, 10, 28, 0.55);
    --line: rgba(255, 226, 236, 0.22);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  .wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #mv { display: block; background: #000; box-shadow: 0 0 80px rgba(0, 0, 0, 0.6); }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%;
    border: 0; cursor: pointer;
    background: var(--rose); color: #FFF3F6;
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(184, 50, 90, 0.55), 0 0 0 10px rgba(255, 255, 255, 0.08);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .play svg { width: 40px; height: 40px; margin-left: 6px; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 10px 40px rgba(184, 50, 90, 0.55), 0 0 0 10px rgba(255, 255, 255, 0.08); } 50% { box-shadow: 0 10px 40px rgba(184, 50, 90, 0.55), 0 0 0 22px rgba(255, 255, 255, 0.04); } }
  .bar {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; justify-content: space-between; align-items: center;
    padding-inline: 16px;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .bar > * { pointer-events: auto; }
  .bar.dim { opacity: 0; }
  .round {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    cursor: pointer;
  }
  .round svg { width: 22px; height: 22px; }
  .round:focus-visible, .play:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .progress { flex: 1; height: 3px; margin-inline: 14px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--gold); }
  .rotate {
    position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%);
    padding: 8px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    font-size: 13px; white-space: nowrap;
    display: none;
  }
  @media (orientation: portrait) and (max-width: 700px) { .rotate { display: block; } }
  @media (prefers-reduced-motion: reduce) { .play { animation: none; } }
</style>
</head>
<body>
<div class="wrap"><canvas id="mv" aria-label="MV hoạt hình: phố cũ Hà Nội, một năm ở Nhật, rồi gặp lại"></canvas></div>
<audio id="song" src="cho-chut-dk.mp3" preload="auto"></audio>

<div class="ui">
  <p class="rotate" id="rotate">Xoay ngang điện thoại để xem to hơn</p>
  <button class="play" id="play" type="button" aria-label="Phát MV">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
  </button>
  <div class="bar" id="bar">
    <button class="round" id="back" type="button" aria-label="Quay lại thiệp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
    <button class="round" id="replay" type="button" aria-label="Xem lại" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="round" id="fs" type="button" aria-label="Toàn màn hình">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  /* =========================================================
     MV "Chờ chút": phố cũ Hà Nội → Nhật Bản → gặp lại
     Khung logic 1600×900; mọi thứ vẽ theo thời gian t (giây) của bài hát.
     ========================================================= */
  const W = 1600, H = 900, DURATION = 94;
  const POSTER_T = 25.2;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  const cv = document.getElementById("mv");
  const ctx = cv.getContext("2d");
  const song = document.getElementById("song");

  /* ---------- tiện ích ---------- */
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const eOut = (x) => 1 - Math.pow(1 - x, 3);
  const eBack = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const R = (i, k = 0) => { const x = Math.sin(i * 12.9898 + k * 78.233 + 0.5) * 43758.5453; return x - Math.floor(x); };
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mixA = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const css = (a, al = 1) => `rgba(${a.map((v) => Math.round(v)).join(",")},${al})`;
  const shade = (h, k) => css(rgb(h).map((v) => (k < 0 ? v * (1 + k) : v + (255 - v) * k)));
  const pulse = (t, a, b) => (t < a || t > b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));

  function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  function rrect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function heart(c, x, y, s, color) {
    c.save(); c.translate(x, y); c.fillStyle = color; c.beginPath();
    c.moveTo(0, s * 0.35);
    c.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.45, -s * 1.05, 0, -s * 0.45);
    c.bezierCurveTo(s * 0.45, -s * 1.05, s * 1.1, -s * 0.35, 0, s * 0.35);
    c.fill(); c.restore();
  }
  function glow(c, x, y, r, color, a) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, css(rgb(color), a)); g.addColorStop(1, css(rgb(color), 0));
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* ---------- kích thước & bộ đệm ---------- */
  let scale = 1;
  const mk = () => { const c = document.createElement("canvas"); c.width = Math.round(W * scale); c.height = Math.round(H * scale); const x = c.getContext("2d"); x.setTransform(scale, 0, 0, scale, 0, 0); return [c, x]; };
  let bgA, bgC, bufL, bufR;
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = Math.floor(W * s) + "px";
    cv.style.height = Math.floor(H * s) + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = Math.min(s * dpr, 1.25);
    cv.width = Math.round(W * scale);
    cv.height = Math.round(H * scale);
    bgA = mk(); drawFacadeA(bgA[1]);
    bgC = mk(); drawFacadeC(bgC[1]);
    bufL = mk(); bufR = mk();
  }

  /* =========================================================
     NHÂN VẬT (vẽ theo đơn vị nhỏ, gốc ở chân; s = tỉ lệ)
     ========================================================= */
  function nonLa(c, x, y, w, tilt = 0) {
    c.save(); c.translate(x, y); c.rotate(tilt);
    c.fillStyle = "#F3D58A"; c.strokeStyle = "#C9A24E"; c.lineWidth = w * 0.025;
    c.beginPath(); c.moveTo(-w / 2, 0); c.lineTo(0, -w * 0.48); c.lineTo(w / 2, 0); c.quadraticCurveTo(0, w * 0.1, -w / 2, 0); c.fill(); c.stroke();
    c.lineWidth = w * 0.015;
    line(c, -w * 0.25, -w * 0.24, w * 0.25, -w * 0.24);
    line(c, -w * 0.37, -w * 0.12, w * 0.37, -w * 0.12);
    c.restore();
  }

  function girl(c, x, y, s, o = {}) {
    const t = o.t || 0;
    c.save(); c.translate(x, y); c.scale(s, s);
    c.lineCap = "round";
    if (!o.noShadow) { c.fillStyle = "rgba(0,0,0,0.18)"; c.beginPath(); c.ellipse(0, 0.5, 10, 2.2, 0, 0, Math.PI * 2); c.fill(); }
    // chân
    if (!o.noLegs) {
      const sw = o.walk ? Math.sin(o.walk) * 2.2 : 0;
      c.fillStyle = "#3A2230";
      rrect(c, -4 + sw, -9, 3, 9, 1); c.fill();
      rrect(c, 1 - sw, -9, 3, 9, 1); c.fill();
      c.fillStyle = "#FFFFFF"; rrect(c, -4.5 + sw, -1.6, 4, 1.8, 0.8); c.fill(); rrect(c, 0.5 - sw, -1.6, 4, 1.8, 0.8); c.fill();
    }
    // túi vàng đeo chéo
    c.strokeStyle = "#C98A1E"; c.lineWidth = 0.8; line(c, 4.5, -20.5, -6.5, -12);
    c.fillStyle = "#FFC94A"; rrect(c, -10.5, -14.5, 6.5, 6, 1.6); c.fill();
    // váy
    const dg = c.createLinearGradient(0, -21, 0, -8);
    dg.addColorStop(0, "#FF8FB8"); dg.addColorStop(1, "#FF5F9A");
    c.fillStyle = dg;
    c.beginPath(); c.moveTo(-8.5, -8); c.lineTo(8.5, -8); c.lineTo(5, -21); c.lineTo(-5, -21); c.closePath(); c.fill();
    c.fillStyle = "#FFFFFF"; c.beginPath(); c.moveTo(-5, -21); c.lineTo(5, -21); c.lineTo(5.6, -18.6); c.lineTo(-5.6, -18.6); c.closePath(); c.fill();
    // khăn len (mùa đông)
    if (o.scarf) { c.fillStyle = "#E8243C"; rrect(c, -5.2, -22.6, 10.4, 3.4, 1.6); c.fill(); rrect(c, 2, -21, 2.6, 7, 1.2); c.fill(); }
    // tay
    c.strokeStyle = "#FFE0C7"; c.lineWidth = 2.4;
    const aL = o.armL || 0, aR = o.armR || 0;
    line(c, -5, -19, -5 - Math.sin(0.45 + aL) * 9, -19 + Math.cos(0.45 + aL) * 9);
    const hx = 5 + Math.sin(0.45 + aR) * 9, hy = -19 + Math.cos(0.45 + aR) * 9;
    line(c, 5, -19, hx, hy);
    if (o.holdHat) nonLa(c, hx + 1, hy + 2, 14, -0.4);
    if (o.leaf) { c.fillStyle = "#E0442B"; c.beginPath(); c.ellipse(hx + 1.5, hy - 1.5, 2.6, 1.6, -0.6, 0, Math.PI * 2); c.fill(); }
    if (o.sparkler) {
      c.strokeStyle = "#8B5A3C"; c.lineWidth = 0.5; line(c, hx, hy, hx + 3, hy - 6);
      c.save(); c.globalCompositeOperation = "lighter";
      for (let i = 0; i < 10; i++) { const a = R(i, Math.floor(t * 20)) * Math.PI * 2, r = 1 + R(i + 9, Math.floor(t * 20)) * 4; c.fillStyle = "rgba(255,220,140,0.9)"; c.fillRect(hx + 3 + Math.cos(a) * r, hy - 6 + Math.sin(a) * r, 0.5, 0.5); }
      c.restore();
    }
    // tóc sau (đung đưa nhẹ)
    const sway = Math.sin(t * 2.2) * 0.6 + (o.wind || 0);
    c.fillStyle = "#3A2230";
    c.beginPath(); c.moveTo(-8.5, -27); c.quadraticCurveTo(-9, -36, 0, -36.5); c.quadraticCurveTo(9, -36, 8.5, -27);
    c.lineTo(8.5 + sway, -16.5); c.quadraticCurveTo(0, -15 + sway * 0.3, -8.5 + sway, -16.5); c.closePath(); c.fill();
    // mặt
    c.fillStyle = "#FFE0C7"; c.beginPath(); c.arc(0, -28, 6.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#3A2230";
    c.beginPath(); c.moveTo(-7, -29); c.quadraticCurveTo(-6, -37, 0, -36.5); c.quadraticCurveTo(7, -37, 7, -29); c.quadraticCurveTo(3, -33, -1, -31); c.quadraticCurveTo(-4, -33, -7, -29); c.fill();
    const lk = (o.look || 0) * 0.9, down = o.down ? 0.7 : 0;
    if (o.closed) {
      c.strokeStyle = "#3A2230"; c.lineWidth = 0.7;
      c.beginPath(); c.arc(-2.4, -27.8, 1, 0.2, Math.PI - 0.2); c.stroke();
      c.beginPath(); c.arc(2.4, -27.8, 1, 0.2, Math.PI - 0.2); c.stroke();
    } else {
      c.fillStyle = "#3A2230";
      c.beginPath(); c.arc(-2.4 + lk, -27.5 + down, 0.95, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(2.4 + lk, -27.5 + down, 0.95, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#FFFFFF"; c.fillRect(-2.1 + lk, -28.2 + down, 0.4, 0.4); c.fillRect(2.7 + lk, -28.2 + down, 0.4, 0.4);
    }
    c.fillStyle = css([255, 143, 184], 0.55 + (o.blush || 0) * 0.4);
    const br = 1.4 + (o.blush || 0) * 0.6;
    c.beginPath(); c.arc(-4, -25.4, br, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(4, -25.4, br, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#B8325A"; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-1.2, -24.6); c.quadraticCurveTo(0, o.smile ? -23 : -23.6, 1.2, -24.6); c.stroke();
    // nơ
    c.fillStyle = "#FF4F7B";
    c.beginPath(); c.moveTo(4, -36); c.lineTo(7, -38); c.lineTo(7, -34); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(4, -36); c.lineTo(1, -38); c.lineTo(1, -34); c.closePath(); c.fill();
    if (o.hat) nonLa(c, 0, -32.5, 25, 0.04);
    c.restore();
  }

  function boy(c, x, y, s, o = {}) {
    const t = o.t || 0;
    c.save(); c.translate(x, y); c.scale(s, s);
    c.lineCap = "round";
    c.fillStyle = "rgba(0,0,0,0.18)"; c.beginPath(); c.ellipse(0, 0.5, 10, 2.2, 0, 0, Math.PI * 2); c.fill();
    const sw = o.walk ? Math.sin(o.walk) * 2.6 : 0;
    c.fillStyle = "#2F3A6B";
    rrect(c, -4.5 + sw, -10, 3.5, 10, 1); c.fill();
    rrect(c, 1 - sw, -10, 3.5, 10, 1); c.fill();
    c.fillStyle = "#FFFFFF"; rrect(c, -5 + sw, -1.6, 4.4, 1.8, 0.8); c.fill(); rrect(c, 0.6 - sw, -1.6, 4.4, 1.8, 0.8); c.fill();
    const sg = c.createLinearGradient(0, -23, 0, -9);
    sg.addColorStop(0, "#6E9CF5"); sg.addColorStop(1, "#4F7FE0");
    c.fillStyle = sg;
    c.beginPath(); c.moveTo(-8, -9); c.lineTo(8, -9); c.lineTo(6.5, -23); c.lineTo(-6.5, -23); c.closePath(); c.fill();
    if (o.scarf) { c.fillStyle = "#E8243C"; rrect(c, -5.6, -24.4, 11.2, 3.6, 1.6); c.fill(); rrect(c, -4.6, -22.4, 2.8, 8, 1.2); c.fill(); }
    c.strokeStyle = "#FFD9B8"; c.lineWidth = 2.6;
    let lx, ly, rx, ry;
    if (o.hatOver) {
      lx = -7; ly = -40; rx = 7; ry = -40;
      line(c, -6, -20, lx, ly); line(c, 6, -20, rx, ry);
    } else {
      const aL = o.armL || 0, aR = o.armR || 0;
      lx = -6 - Math.sin(0.45 + aL) * 9; ly = -20 + Math.cos(0.45 + aL) * 9;
      rx = 6 + Math.sin(0.45 + aR) * 9; ry = -20 + Math.cos(0.45 + aR) * 9;
      line(c, -6, -20, lx, ly); line(c, 6, -20, rx, ry);
    }
    if (o.holdHat) nonLa(c, rx + 2, ry + 3, 16, -0.35);
    if (o.holdHatL) nonLa(c, lx - 3, ly + 2, 16, 0.3);
    if (o.phone) { c.fillStyle = "#2B1A33"; rrect(c, rx - 1.6, ry - 4, 3.6, 6, 0.8); c.fill(); c.fillStyle = "rgba(160,220,255,0.9)"; c.fillRect(rx - 1, ry - 3.3, 2.4, 4.4); }
    // mặt + tóc
    c.fillStyle = "#FFD9B8"; c.beginPath(); c.arc(0, -29.5, 7, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#2B1A33";
    c.beginPath(); c.moveTo(-7.2, -30); c.quadraticCurveTo(-7, -38.5, 0, -38); c.quadraticCurveTo(7.5, -38.5, 7.2, -30); c.quadraticCurveTo(3, -34.5, -2, -33.5); c.quadraticCurveTo(-5, -33, -7.2, -30); c.fill();
    const lk = (o.look || 0) * 0.9, down = o.down ? 0.7 : 0;
    c.fillStyle = "#2B1A33";
    c.beginPath(); c.arc(-2.5 + lk, -28.5 + down, 0.95, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(2.5 + lk, -28.5 + down, 0.95, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#FFFFFF"; c.fillRect(-2.2 + lk, -29.2 + down, 0.4, 0.4); c.fillRect(2.8 + lk, -29.2 + down, 0.4, 0.4);
    c.fillStyle = css([255, 143, 184], 0.45 + (o.blush || 0) * 0.45);
    const br = 1.4 + (o.blush || 0) * 0.6;
    c.beginPath(); c.arc(-4.3, -26.4, br, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(4.3, -26.4, br, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#8A3A4F"; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-1.4, -25.6); c.quadraticCurveTo(0, o.smile ? -24 : -24.5, 1.4, -25.6); c.stroke();
    if (o.hat) nonLa(c, 0, -33.5, 28, 0);
    if (o.hatOver) nonLa(c, 0, -40, 30, 0);
    c.restore();
  }

  // xe đạp nhìn ngang, rổ hoa phía trước; gốc ở mặt đất giữa hai bánh
  function bike(c, x, y, s, t, moving, rider) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.lineCap = "round"; c.lineJoin = "round";
    const rot = moving ? t * 9 : 0;
    const wheel = (cx) => {
      c.strokeStyle = "#3B2A55"; c.lineWidth = 1.6; c.beginPath(); c.arc(cx, -11, 10, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = "rgba(59,42,85,0.45)"; c.lineWidth = 0.4;
      for (let k = 0; k < 6; k++) { const a = rot + (k * Math.PI) / 3; line(c, cx, -11, cx + Math.cos(a) * 9.5, -11 + Math.sin(a) * 9.5); }
    };
    wheel(-16); wheel(16);
    c.strokeStyle = "#F4F4F8"; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-16, -11); c.lineTo(-4, -11); c.lineTo(10, -25); c.lineTo(-7, -25); c.lineTo(-4, -11); c.moveTo(-16, -11); c.lineTo(-7, -25); c.moveTo(10, -25); c.lineTo(16, -11); c.stroke();
    c.lineWidth = 1.6; line(c, -7, -25, -8, -29); line(c, 10, -25, 11, -32);
    c.fillStyle = "#3B2A55"; rrect(c, -11, -30.5, 7, 2.2, 1); c.fill();
    c.strokeStyle = "#3B2A55"; c.lineWidth = 1.4; line(c, 9, -32, 14, -33);
    // rổ hoa

    const [top, bot] = blendSky(st.sky);
    skyGradient(c, top, bot);
    if (st.moon) { glow(c, 1260, 120, 120, "#FFF2C4", 0.35 * st.moon); c.fillStyle = css([255, 242, 196], st.moon); c.beginPath(); c.arc(1260, 120, 34, 0, Math.PI * 2); c.fill(); }
    rainbow(c, st.rainbow || 0);
    c.save();
    const z = st.zoom || 1, cx = st.cx ?? 800, cy = st.cy ?? 600;
    c.translate(cx, cy); c.scale(z, z); c.translate(-cx - (st.pan || 0), -cy);
    c.drawImage(bgA[0], 0, 0, W, H);
    // tán cây đổi màu theo mùa (phượng đỏ mùa hè)
    if (st.phuong) { c.fillStyle = css([226, 52, 52], 0.75 * st.phuong); for (let i = 0; i < 70; i++) { c.beginPath(); c.arc(200 + (R(i, 61) - 0.5) * 290, 300 + (R(i, 62) - 0.5) * 220, 5 + R(i, 63) * 6, 0, Math.PI * 2); c.fill(); } }
    // phủ màu theo thời tiết
    const tint = [
      [st.sky.rain || 0, "rgba(70,90,120,0.42)"],
      [st.sky.sunset || 0, "rgba(255,140,110,0.22)"],
      [st.sky.night || 0, "rgba(28,22,70,0.62)"]
    ];
    c.globalCompositeOperation = "multiply";
    for (const [a, col] of tint) if (a > 0) { c.globalAlpha = a; c.fillStyle = col; c.fillRect(0, 0, W, H); }
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
    // đèn cửa sổ ấm
    const warm = 0.35 + 0.45 * Math.max(st.sky.rain || 0, st.sky.night || 0, (st.sky.sunset || 0) * 0.6);
    c.globalCompositeOperation = "lighter";
    glow(c, 825, 550, 260, "#FFB347", warm * 0.55);
    c.globalCompositeOperation = "source-over";
    // mặt đường ướt + phản chiếu
    const wet = st.wet || 0;
    if (wet > 0) {
      c.fillStyle = `rgba(40,50,80,${0.35 * wet})`; c.fillRect(0, 814, W, 86);
      c.save(); c.beginPath(); c.rect(0, 814, W, 86); c.clip();
      c.globalAlpha = 0.28 * wet; c.translate(0, 1620); c.scale(1, -1);
      c.drawImage(bgA[0], 0, 0, W, H);
      c.restore();
      c.globalCompositeOperation = "lighter"; glow(c, 825, 860, 200, "#FFB347", 0.25 * wet); c.globalCompositeOperation = "source-over";
    }
    // xe đạp dựng
    if (st.bikeParked != null) bike(c, st.bikeParked, 790, 4.4, t, false, null);
    // nhân vật
    const actors = [];
    if (st.boy) actors.push(["boy", st.boy]);
    if (st.girl) actors.push(["girl", st.girl]);
    actors.sort((a, b) => (a[1].z || 0) - (b[1].z || 0));
    for (const [who, o] of actors) {
      if (who === "boy") boy(c, o.x, o.y || 790, o.s || 6.4, Object.assign({ t }, o));
      else if (o.ride) bike(c, o.x, o.y || 800, 4.6, t, true, Object.assign({ t }, o));
      else girl(c, o.x, o.y || 790, o.s || 6, Object.assign({ t }, o));
    }
    if (st.cat) cat(c, st.cat.x, 806, 4, t, st.cat.walk);
    // tim bay
    if (st.hearts) for (const h of st.hearts) heart(c, h.x, h.y, h.s, h.c);
    if (st.bigHeart) { const k = st.bigHeart; heart(c, 870, 440, 60 * k, "#FF4F7B"); }
    c.restore();
    rain(c, t, st.rain || 0);
    if (st.petals) falling(c, t, Math.floor(70 * st.petals), ["#F3F5D8", "#E6EFC4", "#FFFFFF"], 4, 300, 50);
  }

  const SEASON = {
    spring: { sky: { morning: 1 }, tree: ["#FFC0D3", "#FF9FBE", "#FFD7E4"], fall: ["#FFC0D3", "#FFD7E4"] },
    summer: { sky: { night: 1 }, tree: ["#3E9A57", "#5DBB6E", "#2F7E46"], fall: null },
    autumn: { sky: { sunset: 1 }, tree: ["#FF7A3D", "#E0442B", "#FFB347"], fall: ["#E0442B", "#FF7A3D", "#FFB347"] },
    winter: { sky: { night: 0.85, rain: 0.15 }, tree: null, fall: ["#FFFFFF"] }
  };
  function fireworks(c, tt) {
    const bursts = [[0.3, 330, 200, "#FF6FA5"], [1.2, 1180, 160, "#FFD27A"], [2.1, 700, 120, "#9B7BFF"], [3, 1350, 230, "#FF4F7B"], [3.8, 480, 150, "#7FE3FF"], [4.5, 1000, 210, "#FFD27A"]];
    c.save(); c.globalCompositeOperation = "lighter";
    for (const [bt, x, y, col] of bursts) {
      const age = tt - bt;
      if (age < 0 || age > 1.6) continue;
      const a = 1 - age / 1.6;
      for (let i = 0; i < 48; i++) {
        const ang = (i / 48) * Math.PI * 2;
        const hx = Math.pow(Math.sin(ang), 3), hy = -(13 * Math.cos(ang) - 5 * Math.cos(2 * ang) - 2 * Math.cos(3 * ang) - Math.cos(4 * ang)) / 16 - 0.15;
        const d = 130 * (1 - Math.exp(-age * 3.2));
        glow(c, x + hx * d, y + hy * d + age * age * 30, 9, col, a);
      }
    }
    c.restore();
  }

    if (season === "summer") fireworks(c, tt);
    c.save(); c.translate(820, 720); c.scale(1.22, 1.22); c.translate(-820, -720);
    c.drawImage(bgC[0], 0, 0, W, H);
    // phủ màu theo mùa
    const tintCol = season === "summer" ? "rgba(28,22,70,0.55)" : season === "winter" ? "rgba(40,48,95,0.5)" : season === "autumn" ? "rgba(255,140,110,0.2)" : null;
    if (tintCol) { c.globalCompositeOperation = "multiply"; c.fillStyle = tintCol; c.fillRect(0, 0, W, H); c.globalCompositeOperation = "source-over"; }
    // đèn lồng lễ hội mùa hè
    if (season === "summer") {
      c.strokeStyle = "rgba(40,30,50,0.8)"; c.lineWidth = 2; c.beginPath(); c.moveTo(-20, 250); c.quadraticCurveTo(800, 340, 1620, 250); c.stroke();
      for (let k = 0; k < 14; k++) { const x = 60 + k * 112, y = 250 + Math.sin((k / 13) * Math.PI) * 44 + 12; glow(c, x, y + 14, 46, "#FFB347", 0.45); c.fillStyle = k % 2 ? "#FF4F4F" : "#FFF3E0"; rrect(c, x - 13, y, 26, 34, 10); c.fill(); }

    }

      for (let i = 0; i < 9; i++) { const a = -Math.PI / 2 + (R(i, 74) - 0.5) * 2.2; line(c, 470, 380, 470 + Math.cos(a) * 170, 380 + Math.sin(a) * 150); }
      c.fillStyle = "#FFFFFF"; for (let i = 0; i < 18; i++) { c.beginPath(); c.ellipse(470 + (R(i, 75) - 0.5) * 280, 260 + R(i, 76) * 120, 20, 7, 0, 0, Math.PI * 2); c.fill(); }

  /* =========================================================
     BẦU TRỜI + MÁY BAY (cất cánh lúc hoàng hôn / hạ cánh buổi sáng)
     ========================================================= */
  function cloud(c, x, y, s, a) {
    c.fillStyle = `rgba(255,255,255,${a})`;
    for (const [dx, dy, r] of [[0, 0, 40], [45, -18, 50], [95, 0, 42], [50, 14, 40], [-30, 12, 30], [130, 14, 30]]) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); c.fill(); }
  }
  function skyline(c, col, winA, river, bridge) {
    // sông
    c.fillStyle = river; c.fillRect(0, 800, W, 100);
    c.fillStyle = "rgba(255,255,255,0.18)";
    for (let i = 0; i < 40; i++) c.fillRect(R(i, 85) * W, 812 + R(i, 86) * 80, 30 + R(i, 87) * 60, 2);
    // nhà ống cao thấp, có bồn nước, ăng-ten
    c.fillStyle = col;
    let x = -20, i = 0;
    while (x < W) {
      const w = 38 + R(i, 81) * 64, h = 50 + R(i, 82) * 120 + (R(i, 88) > 0.85 ? 90 : 0), top = 790 - h;
      c.fillRect(x, top, w - 3, h + 10);
      const kind = R(i, 89);
      if (kind < 0.35) { c.beginPath(); c.moveTo(x - 3, top); c.lineTo(x + w / 2, top - 22); c.lineTo(x + w, top); c.fill(); }
      else if (kind < 0.7) { rrect(c, x + w * 0.25, top - 18, w * 0.4, 16, 6); c.fill(); c.fillRect(x + w * 0.3, top - 4, 4, 4); c.fillRect(x + w * 0.55, top - 4, 4, 4); }
      else { c.strokeStyle = col; c.lineWidth = 2; line(c, x + w * 0.6, top, x + w * 0.6, top - 28); line(c, x + w * 0.45, top - 22, x + w * 0.75, top - 22); }
      if (winA > 0) { c.fillStyle = `rgba(255,214,120,${winA})`; for (let k = 0; k < 4; k++) if (R(i, 90 + k) > 0.45) c.fillRect(x + 8 + (k % 2) * (w / 2 - 6), top + 18 + Math.floor(k / 2) * 30, 7, 9); c.fillStyle = col; }
      x += w; i++;
    }
    // cầu Long Biên (dàn thép) bắc qua sông, phía trước
    c.strokeStyle = bridge; c.fillStyle = bridge; c.lineWidth = 4;
    line(c, 0, 812, W, 812); line(c, 0, 772, W, 772);
    for (let bx = 0; bx < W; bx += 64) { line(c, bx, 812, bx + 32, 772); line(c, bx + 32, 772, bx + 64, 812); }
    c.fillRect(0, 810, W, 7);
    for (let bx = 120; bx < W; bx += 300) c.fillRect(bx, 815, 22, 90);
  }
  function flight(c, tt, mode) {
    const dur = mode === "takeoff" ? 7 : 6;
    const k = eIO(clamp(tt / dur));
    if (mode === "takeoff") {
      skyGradient(c, rgb("#2B1E5C"), rgb("#F28C7A"));
      glow(c, 1150, 760, 360, "#FFB47A", 0.6);
      c.fillStyle = "#FFD08A"; c.beginPath(); c.arc(1150, 760, 70, 0, Math.PI * 2); c.fill();
      for (let i = 0; i < 6; i++) cloud(c, ((i * 330 - tt * 40) % 1900) - 150, 180 + R(i, 91) * 260, 0.9 + R(i, 92) * 0.6, 0.18);
      const x = lerp(-150, 1750, k), y = lerp(700, 140, eOut(k));
      c.strokeStyle = "rgba(255,255,255,0.35)"; c.lineWidth = 6; c.lineCap = "round";
      c.beginPath(); c.moveTo(lerp(-150, 1750, Math.max(0, k - 0.35)), lerp(700, 140, eOut(Math.max(0, k - 0.35)))); c.lineTo(x - 60, y + 10); c.stroke();
      plane(c, x, y, 5.5, 1, false);
      skyline(c, "#2A1838", 0.8, "#5B3A6E", "#160B20");
    } else {
      skyGradient(c, rgb("#9FD3F2"), rgb("#FFF1D6"));
      glow(c, 300, 720, 340, "#FFE2A8", 0.65);
      for (let i = 0; i < 7; i++) cloud(c, ((i * 300 + tt * 60) % 1900) - 200, 140 + R(i, 93) * 300, 0.9 + R(i, 94) * 0.7, 0.7);

      skyline(c, "#7E6A92", 0, "#BFD8EA", "#4F3F66");

  }

  /* =========================================================
     CÁC CẢNH THEO THỜI GIAN
     ========================================================= */
  function floatingHearts(t, t0, x, y, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const born = t0 + i * 0.32, age = t - born;
      if (age < 0 || age > 2.6) continue;
      out.push({ x: x + (R(i, 101) - 0.5) * 160 + Math.sin(age * 3 + i) * 12, y: y - age * 110, s: 14 + R(i, 102) * 12, c: ["#FF4F7B", "#FF8FB8", "#FFD27A", "#FFFFFF"][i % 4] });
    }
    return out;
  }

  // 0–38s: phố cũ, mưa, mái hiên, nón lá
  function sceneIntro(c, t) {
    const rainAmt = seg(t, 10, 13) * (1 - seg(t, 30.5, 33.5));
    const st = {
      sky: { rain: rainAmt * 0.95, sunset: seg(t, 33, 38) * 0.4 },
      rain: rainAmt, wet: Math.max(rainAmt, 1 - seg(t, 33, 40)) * (t > 10 ? 1 : 0),
      rainbow: pulse(t, 32.5, 40) * 1, pan: Math.sin(t * 0.15) * 10,
      zoom: lerp(lerp(1.08, 1.34, eIO(seg(t, 11, 16))), 1.12, eIO(seg(t, 33, 38))),
      cx: lerp(lerp(800, 900, eIO(seg(t, 11, 16))), 820, eIO(seg(t, 33, 38))), cy: 700
    };
    // cô gái
    if (t < 12.5) {
      const k = eOut(seg(t, 0.5, 12.5));
      st.girl = { ride: true, x: lerp(-260, 690, k), look: 0, smile: t < 10, z: 1, wind: 1.2 };
    } else if (t < 33.5) {
      st.bikeParked = 690;
      const wx = t < 14.2 ? lerp(700, 830, eIO(seg(t, 12.5, 14.2))) : 830;
      st.girl = { x: wx, walk: t < 14.2 ? t * 12 : 0, z: 1 };
      const g = st.girl;
      if (t > 14.2 && t < 18) g.armR = -2.4 * pulse(t, 14.5, 16.5), g.closed = t > 15 && t < 15.3; // phủi mưa trên tóc
      if (t >= 22 && t < 23.6) g.look = 1;
      if (t >= 25 && t < 26.2) g.look = 1, g.blush = 0.6;
      if (t >= 26.2 && t < 29) g.down = true, g.blush = 1;
      if (t >= 29) g.look = 0.6, g.blush = 0.7, g.smile = true;
      if (t >= 30.6) { g.hat = true; g.armR = 0; }
      if (t >= 32) { const k2 = eIO(seg(t, 32, 33.5)); g.x = lerp(830, 700, k2); g.walk = t * 12; }
    } else {
      const k = eIO(seg(t, 33.5, 38.5));
      st.girl = { ride: true, x: lerp(700, 1900, k), hat: true, smile: true, z: 1 };
    }
    // chàng trai
    if (t >= 17.5) {
      const k = eOut(seg(t, 17.5, 20.5));
      const b = st.boy = { x: lerp(1760, 990, k), walk: t < 20.5 ? t * 16 : 0, hatOver: t < 21.2, z: 0 };
      if (t >= 21.2) b.holdHat = true, b.armR = 0.15;
      if (t >= 23.6 && t < 25) b.look = -1;
      if (t >= 25 && t < 26.2) b.look = -1, b.blush = 0.6;
      if (t >= 26.2 && t < 28.5) b.down = true, b.blush = 1, b.look = 0.4;
      if (t >= 28.5 && t < 30.6) { b.look = -1; b.blush = 0.6; b.armL = 1.15 * eOut(seg(t, 28.5, 29.6)); b.holdHat = false; b.holdHatL = true; }
      if (t >= 30.6) { b.holdHat = false; b.holdHatL = false; b.armL = 0; b.armR = 0; b.look = -0.6; b.smile = true; b.blush = 0.8; }
      if (t >= 33.5) { b.look = 1; b.armR = -2.6 + Math.sin(t * 9) * 0.35; }
      st.hearts = floatingHearts(t, 34.5, 990, 520, 7);
    }
    // mèo
    if (t >= 25.5 && t < 34) {
      const k = t < 28 ? seg(t, 25.5, 28) : t < 29.2 ? 1 : 1 + seg(t, 29.2, 34);
      st.cat = { x: k <= 1 ? lerp(380, 900, k) : lerp(900, 1700, k - 1), walk: !(t >= 28 && t < 29.2) };
    }
    streetScene(c, t, st);
  }

  // 45–66s: chia đôi màn hình, bốn mùa, 12 tháng
  function sceneSplit(c, t) {
    const tt = t - 45, idx = Math.min(3, Math.floor(tt / 5.25)), lt = tt - idx * 5.25;
    const seasons = ["spring", "summer", "autumn", "winter"];
    const season = seasons[idx];
    const gO = { x: 820 };
    if (season === "spring") gO.look = 0.3, gO.smile = true;
    if (season === "summer") gO.sparkler = true, gO.armR = -0.9, gO.smile = true, gO.look = 0.5;
    if (season === "autumn") gO.leaf = true, gO.armR = -1.2, gO.look = 0.6;
    if (season === "winter") gO.scarf = true, gO.holdHat = true, gO.armR = -0.6, gO.look = 0.4, gO.blush = 0.5;
    const L = bufL[1];
    L.setTransform(scale, 0, 0, scale, 0, 0);
    japanScene(L, t, season, lt, { girl: gO });
    // phía Việt Nam
    const vnSky = [{ rain: 0.55 }, { summer: 1 }, { golden: 1 }, { night: 1 }][idx];
    const bO = { x: 900, z: 0 };
    if (idx === 0) bO.look = -0.4;
    if (idx === 1) bO.phone = true, bO.armR = -1.4, bO.down = true;
    if (idx === 2) bO.look = -1;
    if (idx === 3) bO.scarf = true, bO.look = -0.5, bO.blush = 0.4;
    const Rr = bufR[1];
    Rr.setTransform(scale, 0, 0, scale, 0, 0);
    streetScene(Rr, t, {
      sky: vnSky, rain: idx === 0 ? 0.45 : 0, wet: idx === 0 ? 0.8 : 0, moon: idx === 3 ? 1 : 0,
      phuong: idx === 1 ? 1 : 0, petals: idx === 2 ? 0.8 : 0, boy: bO, zoom: 1.22, cx: 900, cy: 720
    });
    // ghép hai nửa
    const half = W / 2;
    c.drawImage(bufL[0], 420 * scale, 0, half * scale, H * scale, 0, 0, half, H);
    c.drawImage(bufR[0], 500 * scale, 0, half * scale, H * scale, half, 0, half, H);
    const dg = c.createLinearGradient(half - 30, 0, half + 30, 0);
    dg.addColorStop(0, "rgba(255,244,248,0)"); dg.addColorStop(0.5, "rgba(255,244,248,0.9)"); dg.addColorStop(1, "rgba(255,244,248,0)");
    c.fillStyle = dg; c.fillRect(half - 30, 0, 60, H);
    heart(c, half, 470, 16, "#FF4F7B");
    // 12 vầng trăng đếm tháng
    const filled = clamp(tt / 20.5) * 12;
    c.fillStyle = "rgba(20,10,30,0.45)"; rrect(c, half - 200, 26, 400, 40, 20); c.fill();
    for (let i = 0; i < 12; i++) {
      const on = i < filled, x = half - 165 + i * 30;
      if (on) glow(c, x, 46, 18, "#FFD27A", 0.5);
      c.fillStyle = on ? "#FFD27A" : "rgba(255,255,255,0.25)";
      c.beginPath(); c.arc(x, 46, on ? 8 : 6, 0, Math.PI * 2); c.fill();
    }
  }

  // 72–94s: một năm sau, gặp lại dưới mái hiên
  function sceneReunion(c, t) {
    const rainAmt = 0.55 * (1 - seg(t, 77, 80));
    const st = {
      sky: { rain: rainAmt, sunset: seg(t, 79, 86) * 0.85 },
      rain: rainAmt, wet: 1 - seg(t, 80, 90) * 0.6,
      rainbow: pulse(t, 79.5, 92) * 0.9,
      petals: seg(t, 80, 82),
      zoom: lerp(lerp(1.12, 1.36, eIO(seg(t, 77, 81))), 1.04, eIO(seg(t, 85, 92))), cx: lerp(820, 905, eIO(seg(t, 77, 81))), cy: 700
    };
    const b = st.boy = { x: 960, z: 0, look: -0.5 };
    if (t < 74.5) b.look = Math.sin(t * 1.4) > 0 ? -1 : 0.3;
    if (t >= 78) b.look = -1;
    if (t >= 80) b.blush = 0.8, b.smile = true;
    if (t < 79.2) {
      const k = eOut(seg(t, 73.5, 79.2));
      st.girl = { ride: true, x: lerp(-260, 690, k), hat: true, smile: true, z: 1 };
    } else {
      st.bikeParked = 690;
      const g = st.girl = { x: lerp(700, 850, eIO(seg(t, 79.2, 80.8))), walk: t < 80.8 ? t * 12 : 0, hat: true, look: 1, smile: true, z: 1, blush: 0.6 };
      if (t >= 81.2 && t < 82.6) { g.armR = -2.3 * eOut(seg(t, 81.2, 82)); g.armL = -2.3 * eOut(seg(t, 81.2, 82)); }
      if (t >= 82.6) { g.hat = false; g.armR = 0; g.armL = 0; b.hat = true; g.closed = t < 84; b.closed = true; }
    }
    if (t >= 82.6) st.hearts = floatingHearts(t, 82.8, 905, 560, 26);
    if (t >= 83.4) st.bigHeart = t < 84.4 ? eBack(seg(t, 83.4, 84.4)) : 1 + 0.08 * Math.max(0, Math.sin(t * 6));
    streetScene(c, t, st);
    // dòng kết
    const a = seg(t, 87, 88.6);
    if (a > 0) {
      c.save(); c.globalAlpha = a;
      const g = c.createLinearGradient(0, 120, 0, 260);
      g.addColorStop(0, "#FFF3C4"); g.addColorStop(0.5, "#F2B84B"); g.addColorStop(1, "#C8901E");
      const sh = c.createLinearGradient(0, 0, 0, 440); sh.addColorStop(0, "rgba(20,8,24,0.88)"); sh.addColorStop(0.75, "rgba(20,8,24,0.7)"); sh.addColorStop(1, "rgba(20,8,24,0)"); c.fillStyle = sh; c.fillRect(0, 0, W, 470);
      c.textAlign = "center"; c.textBaseline = "middle";
      c.font = '700 120px "Dancing Script", cursive'; c.fillStyle = g; c.fillText("20 · 10", W / 2, 170);
      c.font = 'italic 500 46px "Lora", Georgia, serif'; c.fillStyle = "#FFF4F8"; c.fillText("Gửi Người đẹp", W / 2, 272);
      c.font = '700 26px "Be Vietnam Pro", system-ui, sans-serif'; c.fillStyle = "rgba(255,244,248,0.85)"; c.fillText("— Trai đẹp giấu tên —", W / 2, 330);
      c.restore();
    }
  }

  function render(t) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (t < 38) sceneIntro(ctx, t);
    else if (t < 45) flight(ctx, t - 38, "takeoff");
    else if (t < 66) sceneSplit(ctx, t);
    else if (t < 72) flight(ctx, t - 66, "landing");
    else sceneReunion(ctx, t);
    vignette(ctx, 0.5);
    // chuyển cảnh: tối nhẹ qua mỗi lần cắt
    let a = Math.max(1 - t / 0.9, seg(t, 92.6, 94));
    for (const cut of [38, 45, 66, 72]) a = Math.max(a, 1 - Math.abs(t - cut) / 0.45);
    if (a > 0) { ctx.fillStyle = `rgba(10,4,16,${clamp(a)})`; ctx.fillRect(0, 0, W, H); }
  }

  /* =========================================================
     PHÁT / DỪNG / ĐỒNG BỘ NHẠC
     ========================================================= */
  const playBtn = document.getElementById("play"), bar = document.getElementById("bar"), prog = document.getElementById("prog");
  const replayBtn = document.getElementById("replay");
  let state = "poster", clock0 = 0, clockBase = 0, useClock = false, lastT = POSTER_T, dimTimer = null;
  function now() {
    if (!useClock && !song.paused && song.readyState >= 2) return song.currentTime;
    return clockBase + (performance.now() - clock0) / 1000;
  }
  function showBar() {
    bar.classList.remove("dim");
    clearTimeout(dimTimer);
    if (state === "playing") dimTimer = setTimeout(() => bar.classList.add("dim"), 2600);
  }
  function start(from = 0) {
    state = "playing";
    playBtn.hidden = true; replayBtn.hidden = true;
    clockBase = from; clock0 = performance.now(); useClock = false;
    try { song.currentTime = from; } catch (e) {}
    const p = song.play();
    if (p && p.catch) p.catch(() => { useClock = true; clockBase = from; clock0 = performance.now(); });
    showBar();
  }
  function pause() {
    state = "paused"; lastT = now(); song.pause();
    playBtn.hidden = false; showBar();
  }
  function resume() { start(lastT); }
  function finish() {
    state = "ended"; song.pause(); lastT = DURATION;
    replayBtn.hidden = false; showBar(); bar.classList.remove("dim");
  }
  playBtn.addEventListener("click", (e) => { e.stopPropagation(); state === "paused" ? resume() : start(0); });
  replayBtn.addEventListener("click", (e) => { e.stopPropagation(); start(0); });
  cv.addEventListener("click", () => { if (state === "playing") pause(); else if (state === "paused") resume(); });
  document.addEventListener("pointermove", showBar);
  document.getElementById("back").addEventListener("click", () => {
    song.pause();
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) history.back();
    else location.href = "./";
  });
  document.getElementById("fs").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        try { await screen.orientation.lock("landscape"); } catch (e) {}
      } else await document.exitFullscreen();
    } catch (e) {}
  });
  song.addEventListener("ended", finish);

  function loop() {
    let t = lastT;
    if (state === "playing") {
      t = now();
      if (t >= DURATION) { finish(); t = DURATION; }
      prog.style.width = (clamp(t / DURATION) * 100).toFixed(2) + "%";
    }
    if (state === "playing" || needsPaint) { render(t); needsPaint = false; }
    requestAnimationFrame(loop);
  }
  let needsPaint = true;
  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { fit(); needsPaint = true; }, 120); });

  // #t12.5 trên đường dẫn: xem tĩnh một khoảnh khắc (để kiểm tra)
  const m = /^#t(\d+(?:\.\d+)?)$/.exec(location.hash);
  if (m) lastT = parseFloat(m[1]);

  const fontsReady = document.fonts && document.fonts.load
    ? Promise.race([
        Promise.all(['800 34px "Be Vietnam Pro"', '700 120px "Dancing Script"', 'italic 500 34px "Lora"'].map((f) => document.fonts.load(f, "TẠP HOÁ ờ"))),
        new Promise((r) => setTimeout(r, 2500))
      ])
    : Promise.resolve();
  fontsReady.then(() => { fit(); needsPaint = true; requestAnimationFrame(loop); });

  // Dùng khi xuất video: vẽ đúng khung hình ở thời điểm t với độ rộng px cho trước
  window.__mv = {
    ready: fontsReady,
    duration: DURATION,
    exportScale(px) {
      state = "export";
      scale = px / W;
      cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
      bgA = mk(); drawFacadeA(bgA[1]);
      bgC = mk(); drawFacadeC(bgC[1]);
      bufL = mk(); bufR = mk();
    },
    render
  };
})();
</script>
